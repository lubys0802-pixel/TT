<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="空壓機配置">
  <meta name="theme-color" content="#1e1e1e">

  <title>空壓機系統配管配電標註</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #121212; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; }
    
    /* 頂部操作選單 */
    header {
      background: #1e1e1e; padding: env(safe-area-inset-top, 8px) 8px 8px 8px;
      display: flex; gap: 6px; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; z-index: 10;
    }
    .action-btn {
      background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 6px;
      padding: 7px 10px; font-size: 13px; font-weight: 500; cursor: pointer; flex: 1; text-align: center; white-space: nowrap;
    }
    .action-btn.primary { background: #007aff; border-color: #007aff; }

    /* 中間畫布區 */
    #canvas-container {
      flex: 1; position: relative; width: 100%; height: 100%; overflow: hidden;
      display: flex; align-items: center; justify-content: center; background: #000;
    }
    canvas { touch-action: none; display: block; }

    /* 底部模式切換與工具箱 */
    footer {
      background: #1e1e1e; padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px)) 10px;
      display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #333; z-index: 10;
    }
    .scroll-row {
      display: flex; gap: 8px; overflow-x: auto; white-space: nowrap; align-items: center; padding-bottom: 2px;
    }
    .tool-btn {
      background: #2a2a2a; color: #aaa; border: 1.5px solid #444;
      border-radius: 16px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 5px; flex-shrink: 0;
    }
    .tool-btn.active { border-color: #007aff; color: #fff; background: #2c3848; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

    /* 控制列 */
    .control-row {
      display: flex; align-items: center; gap: 8px; font-size: 12px; color: #ccc;
    }
    .control-row input[type="range"] { flex: 1; }
    .control-row input[type="color"] { width: 28px; height: 28px; border: none; border-radius: 4px; background: none; cursor: pointer; }

    /* 自訂彈出文字輸入視窗 (解決 iOS prompt 造成的畫布消失) */
    #textModal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.65); z-index: 100; align-items: center; justify-content: center;
    }
    .modal-box {
      background: #242424; width: 85%; max-width: 320px; border-radius: 12px; padding: 18px;
      display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .modal-box h3 { color: #fff; font-size: 15px; text-align: center; }
    .modal-box input[type="text"] {
      width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #555;
      background: #121212; color: #fff; font-size: 15px; outline: none;
    }
    .modal-btns { display: flex; gap: 8px; }
    .modal-btns button {
      flex: 1; padding: 8px; border-radius: 6px; border: none; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .modal-confirm { background: #007aff; color: #fff; }
    .modal-cancel { background: #444; color: #ccc; }

    #cameraInput { display: none; }
  </style>
</head>
<body>

  <header>
    <label for="cameraInput" class="action-btn primary">📷 拍照取景</label>
    <input type="file" id="cameraInput" accept="image/*" capture="environment">
    <button class="action-btn" id="undoBtn">復原</button>
    <button class="action-btn" id="clearBtn">重整</button>
    <button class="action-btn primary" id="saveBtn">儲存圖檔</button>
  </header>

  <div id="canvas-container">
    <canvas id="paintCanvas"></canvas>
  </div>

  <footer>
    <div class="scroll-row">
      <!-- 直線管路 -->
      <button class="tool-btn active" data-type="pipe-straight" data-color="#00aaff" data-width="6">
        <span class="dot" style="background: #00aaff;"></span>空氣管(藍直)
      </button>
      <button class="tool-btn" data-type="pipe-straight" data-color="#ff3b30" data-width="6">
        <span class="dot" style="background: #ff3b30;"></span>動力電纜(紅直)
      </button>
      <button class="tool-btn" data-type="pipe-straight" data-color="#ff9500" data-width="4">
        <span class="dot" style="background: #ff9500;"></span>排水管(橙直)
      </button>
      
      <!-- 設備與管件圖塊 -->
      <button class="tool-btn" data-type="stamp" data-stamp="compressor">🏭 空壓機</button>
      <button class="tool-btn" data-type="stamp" data-stamp="tank">🛢️ 儲氣筒</button>
      <button class="tool-btn" data-type="stamp" data-stamp="dryer">❄️ 乾燥機</button>
      <button class="tool-btn" data-type="stamp" data-stamp="tee">🔀 空壓三通</button>
      <button class="tool-btn" data-type="stamp" data-stamp="coupler">🔌 快速接頭</button>

      <!-- 文字與塗鴉 -->
      <button class="tool-btn" data-type="text">🔤 文字標註</button>
      <button class="tool-btn" data-type="freehand">✏️ 自由繪圖</button>
    </div>

    <div class="control-row">
      <span id="controlLabel">管線粗細:</span>
      <input type="range" id="sizeRange" min="2" max="60" value="6">
      <span id="sizeValue">6px</span>
      <span style="margin-left: 6px;">顏色:</span>
      <input type="color" id="colorPicker" value="#00aaff">
    </div>
  </footer>

  <!-- 自訂文字輸入視窗 -->
  <div id="textModal">
    <div class="modal-box">
      <h3>輸入標註文字</h3>
      <input type="text" id="modalTextInput" placeholder="例: 1吋鍍鋅管、50HP、380V">
      <div class="modal-btns">
        <button class="modal-cancel" id="modalCancel">取消</button>
        <button class="modal-confirm" id="modalConfirm">確定加入</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvas-container');
    const cameraInput = document.getElementById('cameraInput');

    const sizeRange = document.getElementById('sizeRange');
    const sizeValue = document.getElementById('sizeValue');
    const colorPicker = document.getElementById('colorPicker');
    const controlLabel = document.getElementById('controlLabel');

    // 彈出對話框元件
    const textModal = document.getElementById('textModal');
    const modalTextInput = document.getElementById('modalTextInput');
    const modalConfirm = document.getElementById('modalConfirm');
    const modalCancel = document.getElementById('modalCancel');

    let currentImage = null;
    let currentMode = 'pipe-straight';
    let currentColor = '#00aaff';
    let currentSize = 6;
    let currentStamp = 'compressor';

    let isDrawing = false;
    let straightStart = null;
    let pendingTextPos = null;
    let lastX = 0, lastY = 0;
    let historyStack = [];

    // 初始化畫布尺寸
    function initCanvasSize() {
      if (canvas.width !== container.clientWidth || canvas.height !== container.clientHeight) {
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        redrawBase();
      }
    }
    window.addEventListener('resize', () => {
      // 避免彈出鍵盤時完全清空畫布內容
      if (historyStack.length > 0) {
        ctx.putImageData(historyStack[historyStack.length - 1], 0, 0);
      } else {
        initCanvasSize();
      }
    });

    function saveState() {
      if (historyStack.length >= 15) historyStack.shift();
      historyStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    }

    function redrawBase() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      if (currentImage) {
        const hRatio = canvas.width / currentImage.width;
        const vRatio = canvas.height / currentImage.height;
        const ratio = Math.min(hRatio, vRatio);
        const shiftX = (canvas.width - currentImage.width * ratio) / 2;
        const shiftY = (canvas.height - currentImage.height * ratio) / 2;
        ctx.drawImage(currentImage, 0, 0, currentImage.width, currentImage.height,
                      shiftX, shiftY, currentImage.width * ratio, currentImage.height * ratio);
      }
    }

    // 載入照片
    cameraInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          currentImage = img;
          historyStack = [];
          redrawBase();
          saveState();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    function getTouchPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    // 繪製設備與管件圖塊
    function drawStamp(x, y, type, size) {
      ctx.save();
      ctx.translate(x, y);
      const w = size * 2.2;
      const h = size * 1.5;

      if (type === 'compressor') {
        ctx.fillStyle = '#2c3e50';
        ctx.strokeStyle = '#00d2ff';
        ctx.lineWidth = 3;
        ctx.fillRect(-w/2, -h/2, w, h);
        ctx.strokeRect(-w/2, -h/2, w, h);
        ctx.fillStyle = '#00d2ff';
        ctx.font = `bold ${Math.max(12, size * 0.4)}px sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('空壓機', 0, 0);
      } else if (type === 'tank') {
        ctx.fillStyle = '#1e3799';
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        const r = w / 2;
        ctx.roundRect(-r, -h/1.2, w, h * 1.6, 16);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${Math.max(12, size * 0.38)}px sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('儲氣筒', 0, 0);
      } else if (type === 'dryer') {
        ctx.fillStyle = '#0a3d62';
        ctx.strokeStyle = '#60a5fa';
        ctx.lineWidth = 3;
        ctx.fillRect(-w/2, -h/2, w, h);
        ctx.strokeRect(-w/2, -h/2, w, h);
        ctx.fillStyle = '#60a5fa';
        ctx.font = `bold ${Math.max(12, size * 0.4)}px sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('乾燥機', 0, 0);
      } else if (type === 'tee') {
        // 三通管件 (Tee) 圖塊
        const arm = size * 0.8;
        ctx.strokeStyle = currentColor;
        ctx.lineWidth = Math.max(4, size * 0.25);
        ctx.lineCap = 'round';
        ctx.beginPath();
        // 水平通管
        ctx.moveTo(-arm, 0); ctx.lineTo(arm, 0);
        // 分支向上
        ctx.moveTo(0, 0); ctx.lineTo(0, -arm);
        ctx.stroke();

        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(0, 0, ctx.lineWidth * 0.8, 0, Math.PI * 2); ctx.fill();
      } else if (type === 'coupler') {
        // 快速接頭圖塊 (母頭+插銷)
        const rad = Math.max(10, size * 0.5);
        ctx.fillStyle = currentColor;
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(0, 0, rad, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();

        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, rad * 0.45, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
    }

    // 觸控事件
    canvas.addEventListener('touchstart', (e) => {
      const pos = getTouchPos(e);

      if (currentMode === 'stamp') {
        drawStamp(pos.x, pos.y, currentStamp, currentSize);
        saveState();
      } else if (currentMode === 'text') {
        pendingTextPos = pos;
        modalTextInput.value = '';
        textModal.style.display = 'flex';
        setTimeout(() => modalTextInput.focus(), 50);
      } else if (currentMode === 'pipe-straight') {
        if (!straightStart) {
          straightStart = pos;
          // 畫一個小起點標記
          ctx.fillStyle = currentColor;
          ctx.beginPath();
          ctx.arc(pos.x, pos.y, currentSize / 2, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.moveTo(straightStart.x, straightStart.y);
          ctx.lineTo(pos.x, pos.y);
          ctx.strokeStyle = currentColor;
          ctx.lineWidth = currentSize;
          ctx.lineCap = 'round';
          ctx.stroke();
          straightStart = null;
          saveState();
        }
      } else if (currentMode === 'freehand') {
        isDrawing = true;
        lastX = pos.x;
        lastY = pos.y;
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      if (currentMode === 'freehand' && isDrawing) {
        const pos = getTouchPos(e);
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(pos.x, pos.y);
        ctx.strokeStyle = currentColor;
        ctx.lineWidth = currentSize;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();
        lastX = pos.x;
        lastY = pos.y;
        e.preventDefault();
      }
    }, { passive: false });

    canvas.addEventListener('touchend', () => {
      if (currentMode === 'freehand' && isDrawing) {
        isDrawing = false;
        saveState();
      }
    });

    // 文字彈出視窗確認
    modalConfirm.addEventListener('click', () => {
      const text = modalTextInput.value.trim();
      if (text && pendingTextPos) {
        ctx.font = `bold ${currentSize}px sans-serif`;
        ctx.fillStyle = currentColor;
        ctx.shadowColor = '#000';
        ctx.shadowBlur = 5;
        ctx.fillText(text, pendingTextPos.x, pendingTextPos.y);
        ctx.shadowBlur = 0;
        saveState();
      }
      textModal.style.display = 'none';
      pendingTextPos = null;
    });

    modalCancel.addEventListener('click', () => {
      textModal.style.display = 'none';
      pendingTextPos = null;
    });

    // 切換按鈕
    document.querySelectorAll('.tool-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        currentMode = btn.dataset.type;
        straightStart = null;

        if (currentMode === 'pipe-straight') {
          currentColor = btn.dataset.color;
          currentSize = parseInt(btn.dataset.width, 10);
          controlLabel.textContent = '管線粗細:';
          sizeRange.value = currentSize;
        } else if (currentMode === 'stamp') {
          currentStamp = btn.dataset.stamp;
          currentSize = (currentStamp === 'tee' || currentStamp === 'coupler') ? 25 : 40;
          controlLabel.textContent = '圖塊尺寸:';
          sizeRange.value = currentSize;
        } else if (currentMode === 'text') {
          currentSize = 22;
          controlLabel.textContent = '文字字體大小:';
          sizeRange.value = currentSize;
        } else if (currentMode === 'freehand') {
          currentColor = colorPicker.value;
          currentSize = 4;
          controlLabel.textContent = '自由畫筆粗細:';
          sizeRange.value = currentSize;
        }
        sizeValue.textContent = `${sizeRange.value}px`;
      });
    });

    sizeRange.addEventListener('input', (e) => {
      currentSize = parseInt(e.target.value, 10);
      sizeValue.textContent = `${currentSize}px`;
    });

    colorPicker.addEventListener('input', (e) => {
      currentColor = e.target.value;
    });

    // 復原
    document.getElementById('undoBtn').addEventListener('click', () => {
      straightStart = null;
      if (historyStack.length > 1) {
        historyStack.pop();
        const prevState = historyStack[historyStack.length - 1];
        ctx.putImageData(prevState, 0, 0);
      } else if (historyStack.length === 1) {
        historyStack.pop();
        redrawBase();
      }
    });

    // 重整
    document.getElementById('clearBtn').addEventListener('click', () => {
      straightStart = null;
      historyStack = [];
      redrawBase();
      saveState();
    });

    // 儲存圖檔 (針對 iPhone Safari 深度優化：支援原生分享與長按儲存)
    document.getElementById('saveBtn').addEventListener('click', async () => {
      canvas.toBlob(async (blob) => {
        const file = new File([blob], `空壓機現場配置_${Date.now()}.png`, { type: 'image/png' });

        // 若支援原生分享 (iOS Safari 支援直接分享至相簿/LINE)
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              files: [file],
              title: '空壓機管線配置圖',
              text: '現場繪製空壓機配置'
            });
            return;
          } catch (err) {
            if (err.name !== 'AbortError') console.error(err);
          }
        }

        // 備用方案：直接在新分頁開啟全圖，供長按存入相簿
        const dataUrl = canvas.toDataURL('image/png');
        const imgWin = window.open('');
        if (imgWin) {
          imgWin.document.write(`<title>長按圖片儲存到相簿</title><body style="margin:0;background:#000;display:flex;align-items:center;justify-content:center;"><img src="${dataUrl}" style="max-width:100%;max-height:100%;"></body>`);
        } else {
          const a = document.createElement('a');
          a.download = `空壓機現場配置_${Date.now()}.png`;
          a.href = dataUrl;
          a.click();
        }
      }, 'image/png');
    });

    // 初始化啟動
    initCanvasSize();
  </script>
</body>
</html>
